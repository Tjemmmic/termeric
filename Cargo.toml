[workspace]
resolver = "2"
members = ["termeric", "termeric-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Termeric Contributors"]
license = "MIT"
repository = "https://github.com/Tjemmmic/termeric"
homepage = "https://github.com/Tjemmmic/termeric"
keywords = ["terminal", "emulator", "gpu", "rust"]
categories = ["command-line-utilities"]
# Termeric ships as a program, not as crates. This also keeps both crates out
# of the generated third-party notices (cargo-about skips unpublished crates).
publish = false

[workspace.dependencies]
# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Utilities
bitflags = "2.6"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Release optimization with symbols, for profilers such as perf and heaptrack.
# See "Profiling and debugging builds" in CONTRIBUTING.md.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Ordinary dev builds keep only line tables. This profile adds full debug
# information for GDB or LLDB; see CONTRIBUTING.md.
[profile.debugging]
inherits = "dev"
debug = 2
