[meta]
name = "Yuca"
author = "Termeric"
description = "Bark-brown skin with bright starchy white flesh — cassava root"

[primary]
black = "#2F251F"   # Dark bark, lifted off the background
red = "#CC6966"     # Red tinted toward pink-coral inner bark
green = "#43883B"   # Deep tropical leaf green, lifted for contrast
yellow = "#C6A56C"  # Woody tan bark, lifted for contrast
blue = "#4D7DAC"    # Blue tinted toward cool tropical shadow
magenta = "#BA6690" # Magenta tinted toward warm coral
cyan = "#3C867A"    # Cyan tinted toward tropical green
white = "#FAFAF8"   # Bright starchy white flesh

[bright]
black = "#7F6455"   # Rough woody bark, lifted for readable dim text
red = "#DB9694"     # Bright red tinted toward light coral
green = "#59A64B"   # Bright tropical, richer so it reads as green
yellow = "#D8C090"  # Light bark tan
blue = "#7198BF"    # Bright blue tinted toward light teal
magenta = "#CC8CAC" # Bright magenta tinted toward light warm coral
cyan = "#4DAB9B"    # Bright cyan tinted toward mid tropical
white = "#FEFEFE"   # Chalky white

