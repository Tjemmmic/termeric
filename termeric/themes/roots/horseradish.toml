[meta]
name = "Horseradish"
author = "Termeric"
description = "Sandy tan skin with sharp white flesh — bold and pungent"

[primary]
black = "#312F2B"   # Root earth, a step above the background
red = "#DB6864"     # Pungent red
green = "#6CB349"   # Crinkled leaf green
yellow = "#D4B539"  # Pale yellow cross-section
blue = "#6B98CB"    # Cool earth shadow
magenta = "#C878AD" # Muted mauve
cyan = "#4FB4A6"    # Leaf teal
white = "#D1CFC3"   # Sharp white flesh

[bright]
black = "#837F75"   # Scarred grey for dim hints
red = "#E79791"     # Bright pungent red
green = "#94D17B"   # Bright leaf green
yellow = "#E4D382"  # Bright cross-section
blue = "#97B8E2"    # Light shadow blue
magenta = "#DE9DC8" # Light mauve
cyan = "#81D1C9"    # Bright leaf teal
white = "#FFFFFE"   # Brightest white

[ui]
background = "#171614"   # Neutral charcoal
foreground = "#F6F5F0"   # Sharp white
cursor = "#F0E4A7"       # Pale yellow cross-section
cursor_text = "#171614"  # Text under the cursor
selection = "#635A2A4D"  # Cross-section tint
border = "#363533"       # Chrome separators
tab_active = "#F0E4A7"   # Pale yellow cross-section
tab_inactive = "#22211F" # Tab strip
search_match = "#43732B" # Leaf green
url = "#88C869"          # Crinkled leaf
