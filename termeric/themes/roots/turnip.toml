[meta]
name = "Turnip"
author = "Termeric"
description = "Cream-to-purple gradient, pure white flesh, sage green leaves"

[primary]
black = "#2C262F"   # Deep root soil, lifted off the background
red = "#C75858"     # Red tinted toward purple-rose top
green = "#7BAA4D"   # Fuzzy sage green leaf, richer so it reads as green
yellow = "#C4B36E"  # Pale cream skin, lifted for contrast
blue = "#6083B8"    # Cool purple-blue, richer so it reads as blue
magenta = "#B459A7"  # Mid purple, richer so it reads as magenta
cyan = "#6AC4B5"    # Cyan tinted toward bright spring leaf
white = "#FAF8F0"   # Pure white flesh

[bright]
black = "#746384"   # Dark purple-grey, lifted for readable dim text
red = "#D47D7D"     # Bright red tinted toward light purple
green = "#A0C46A"   # Spring green
yellow = "#D3C19C"  # Fine hairlike cream, richer so it reads as yellow
blue = "#8CA6CC"    # Light blue, richer so it reads as blue
magenta = "#C781BD" # Bright purple, richer so it reads as magenta
cyan = "#80D8C9"    # Bright cyan tinted toward bright spring
white = "#FEFCF8"   # Brightest white

[ui]
background = "#18151A"
foreground = "#FAF8F0"
cursor = "#9B5BA0"
cursor_text = "#FAF8F0"
selection = "#9B5BA030"
border = "#383040"
tab_active = "#9B5BA0"
tab_inactive = "#28222A"
search_match = "#A0C46A66"
url = "#B8D880"
