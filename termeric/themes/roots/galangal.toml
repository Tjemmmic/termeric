[meta]
name = "Galangal"
author = "Termeric"
description = "Pale pinkish-tan with hot pink shoots — lesser ginger"

[primary]
black = "#38302D"   # Tan bark, a step above the background
red = "#D58380"     # Soft shoot red
green = "#8AB779"   # Soft blade green
yellow = "#D7BE81"  # Soft resin gold
blue = "#8DA0CC"    # Soft shadow blue
magenta = "#D184B0" # Dusty pink shoot
cyan = "#7AB8B1"    # Soft blade teal
white = "#D0BAA7"   # Pale pinkish-tan flesh

[bright]
black = "#8E7C75"   # Pinkish tan for dim hints
red = "#E4A6A1"     # Light shoot red
green = "#A8D19C"   # Light blade green
yellow = "#E7D6A5"  # Light resin
blue = "#AEBCE0"    # Light shadow blue
magenta = "#E3A7C9" # Light dusty pink
cyan = "#9CD1CD"    # Light blade teal
white = "#F1E0CE"   # Light pinkish-tan

[ui]
background = "#221C1B"   # Lifted pinkish-tan dark
foreground = "#EBD7C4"   # Pinkish-tan cream
cursor = "#DE8DAD"       # Dusty pink
cursor_text = "#221C1B"  # Text under the cursor
selection = "#8238504D"  # Dusty pink tint
border = "#3E3633"       # Chrome separators
tab_active = "#DE8DAD"   # Dusty pink
tab_inactive = "#2C2523" # Tab strip
search_match = "#467336" # Blade green
url = "#DF9EC2"          # Dusty pink
