[meta]
name = "Wasabi"
author = "Termeric"
description = "Bright green rhizome with vivid chartreuse flesh"

[primary]
black = "#293033"   # Slate plate, a step above the background
red = "#D76654"     # Salmon red
green = "#75A83B"   # Wasabi green
yellow = "#D4AB39"  # Tamago yellow
blue = "#6690C5"    # Soy-glaze blue
magenta = "#C86E9B" # Pickled-ginger pink
cyan = "#4CA9A6"    # Nori teal
white = "#CEC6B5"   # Rice white

[bright]
black = "#717F85"   # Slate grey for dim hints
red = "#E39180"     # Light salmon
green = "#8BC84F"   # Bright wasabi
yellow = "#E1C875"  # Light tamago
blue = "#90AFDC"    # Light glaze blue
magenta = "#DD94B8" # Light gari pink
cyan = "#6EC7C7"    # Light nori teal
white = "#F8F6EF"   # Bright rice white

[ui]
background = "#151819"   # Dark slate plate
foreground = "#EDE7DC"   # Rice white
cursor = "#8BCA38"       # Wasabi green
cursor_text = "#151819"  # Text under the cursor
selection = "#435D264D"  # Wasabi tint
border = "#333534"       # Chrome separators
tab_active = "#8BCA38"   # Wasabi green
tab_inactive = "#202223" # Tab strip
search_match = "#80651A" # Tamago yellow
url = "#8DC44D"          # Wasabi green
