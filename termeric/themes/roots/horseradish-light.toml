[meta]
name = "Horseradish Light"
author = "Termeric"
description = "Sharp white horseradish flesh over root earth — bold and pungent"

[primary]
black = "#433F37"   # Root earth
red = "#C4332E"     # Pungent red
green = "#4A7B32"   # Crinkled leaf green
yellow = "#957E23"  # Yellow cross-section
blue = "#3A6CA5"    # Cool earth shadow
magenta = "#A84587" # Mauve
cyan = "#357B72"    # Leaf teal
white = "#8A856A"   # Scarred skin

[bright]
black = "#757064"   # Scarred grey for dim hints
red = "#A12E26"     # Deep pungent red
green = "#376624"   # Deep leaf green
yellow = "#74651B"  # Deep cross-section
blue = "#295894"    # Deep shadow blue
magenta = "#933172" # Deep mauve
cyan = "#256660"    # Deep leaf teal
white = "#CECCC4"   # White flesh, a step off the background

[ui]
background = "#E9E8E5"   # Sharp white flesh
foreground = "#353129"   # Root earth
cursor = "#857317"       # Yellow cross-section
cursor_text = "#E9E8E5"  # Text under the cursor
selection = "#CCBC6640"  # Cross-section tint
border = "#D2D0CC"       # Chrome separators
tab_active = "#857317"   # Yellow cross-section
tab_inactive = "#E1E0DC" # Tab strip
search_match = "#75D147" # Leaf green
url = "#43742B"          # Crinkled leaf
