[meta]
name = "Beet"
author = "Termeric"
description = "Deep burgundy and vivid crimson from the beetroot"

[primary]
black = "#362B2C"   # Roasted skin, a step above the background
red = "#C95C66"     # Roasted crimson
green = "#719550"   # Wilted beet greens
yellow = "#C89C42"  # Caramelized gold
blue = "#6D7FB7"    # Dusky purple-blue
magenta = "#BB5F99" # Roasted magenta
cyan = "#539A8E"    # Muted vein teal
white = "#D1C0B7"   # Warm roasted flesh

[bright]
black = "#8D7478"   # Dusty maroon for dim hints
red = "#DC8288"     # Light roasted crimson
green = "#8CB869"   # Light beet greens
yellow = "#DBBB6F"  # Light caramel
blue = "#93A0D1"    # Light dusky blue
magenta = "#D388B7" # Light roasted magenta
cyan = "#6FBAB0"    # Light vein teal
white = "#F5EDE7"   # Light roasted cream

[ui]
background = "#171212"   # Near-black maroon
foreground = "#E9D9D0"   # Warm cream
cursor = "#D46C7D"       # Caramelized rose
cursor_text = "#171212"  # Text under the cursor
selection = "#792E3A59"  # Rose tint
border = "#342E2D"       # Chrome separators
tab_active = "#D46C7D"   # Caramelized rose
tab_inactive = "#221C1C" # Tab strip
search_match = "#7E6125" # Caramel gold
url = "#D58EBB"          # Roasted magenta
