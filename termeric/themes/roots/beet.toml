[meta]
name = "Beet"
author = "Termeric"
description = "Deep burgundy and vivid crimson from the beetroot"

[primary]
black = "#2E1F26"   # Deepest beet skin, lifted off the background
red = "#D34242"     # Red tinted toward vivid crimson flesh
green = "#647E39"   # Dark red-green leaves, richer so it reads as green
yellow = "#D4B24D"  # Yellow tinted toward magenta-pink streak
blue = "#736CBD"    # Blue tinted toward deep purple shadow
magenta = "#CF3A8A"  # Dark beet magenta, nudged apart from neighbouring hues
cyan = "#3A8276"    # Cyan tinted toward beet leaf vein
white = "#F0D0D8"   # Pale pink-white rings

[bright]
black = "#84586A"   # Dark burgundy, lifted for readable dim text
red = "#D97272"     # Bright red tinted toward bright beet red
green = "#7D9B45"   # Beet leaf, richer so it reads as green
yellow = "#DEC782"  # Bright yellow tinted toward light magenta
blue = "#8E89CA"    # Bright blue tinted toward light purple
magenta = "#D66CA5" # Bright magenta, nudged apart from neighbouring hues
cyan = "#479E90"    # Bright cyan tinted toward bright leaf
white = "#F8E0E8"   # Light blush

[ui]
background = "#1A0810"
foreground = "#F0D0D8"
cursor = "#C41E3A"
cursor_text = "#F0D0D8"
selection = "#6B183240"
border = "#4A1028"
tab_active = "#C41E3A"
tab_inactive = "#300818"
search_match = "#D44D6E66"
url = "#E878A0"
