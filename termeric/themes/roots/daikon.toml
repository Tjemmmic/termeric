[meta]
name = "Daikon"
author = "Termeric"
description = "Crisp whites and greens from the Japanese radish"

[primary]
black = "#2A322E"   # Deep soil, a step above the background
red = "#D3696C"     # Radish blush
green = "#5EAD4A"   # Leathery leaf green
yellow = "#C8B140"  # Pale green-top yellow
blue = "#5E94C2"    # Cool shadow blue
magenta = "#BE74A5" # Muted rose
cyan = "#4AAC9B"    # Leaf-vein teal
white = "#C3CBBC"   # Clean white skin

[bright]
black = "#718276"   # Grey-green for dim hints
red = "#E59191"     # Bright blush
green = "#83CA71"   # Bright leaf green
yellow = "#DCCD69"  # Bright green-top yellow
blue = "#89B2DA"    # Light shadow blue
magenta = "#D797C1" # Light rose
cyan = "#6ECABD"    # Bright leaf-vein teal
white = "#FBFCF9"   # Crisp translucent white

[ui]
background = "#161A18"   # Cool green-charcoal
foreground = "#EBEFE5"   # Crisp white
cursor = "#6BC355"       # Fresh leaf green
cursor_text = "#161A18"  # Text under the cursor
selection = "#3B5F334D"  # Leaf tint
border = "#343835"       # Chrome separators
tab_active = "#6BC355"   # Fresh leaf green
tab_inactive = "#212522" # Tab strip
search_match = "#756A22" # Green-top yellow
url = "#7BC7A1"          # Leaf teal
