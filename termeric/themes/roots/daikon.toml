[meta]
name = "Daikon"
author = "Termeric"
description = "Crisp whites and greens from the Japanese radish"

[primary]
black = "#283025"   # Deep soil, lifted off the background
red = "#C66353"     # Radish blush, richer so it reads as red
green = "#4B9041"   # Dark leathery leaf, richer so it reads as green
yellow = "#B6C072"  # Pale green top, richer so it reads as yellow
blue = "#4E86AE"    # Cool shadow, richer so it reads as blue
magenta = "#B96493" # Muted rose, richer so it reads as magenta
cyan = "#4BA798"    # Cyan tinted toward bright leaf green
white = "#F0EDE8"   # Clean white skin

[bright]
black = "#647261"   # Dark earth, lifted for readable dim text
red = "#D28979"     # Warm blush, richer so it reads as red
green = "#6CAA4D"   # Bright radish leaf, lifted for contrast
yellow = "#D3D39C"  # Bright yellow tinted toward pale green fade
blue = "#78A3C2"    # Light blue, richer so it reads as blue
magenta = "#CA88A0" # Light rose, richer so it reads as magenta
cyan = "#70C4B6"    # Bright cyan tinted toward spring green
white = "#FAFAF5"   # Crisp translucent white

[ui]
background = "#1A1F18"
foreground = "#F0EDE8"
cursor = "#6BA34F"
cursor_text = "#1A1F18"
selection = "#B8C08040"
border = "#3A4238"
tab_active = "#6BA34F"
tab_inactive = "#2A3028"
search_match = "#D4E0C466"
url = "#88C470"
