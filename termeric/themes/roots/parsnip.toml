[meta]
name = "Parsnip"
author = "Termeric"
description = "Off-white cream skin with sweet flesh and celery green leaves"

[primary]
black = "#2A2A1C"   # Deep parsnip earth, lifted off the background
red = "#C75A56"     # Red tinted toward warm tan
green = "#5C8C3C"   # Celery green leaf
yellow = "#D8BF5A"  # Faint yellow core, lifted for contrast
blue = "#558DB3"    # Cool shadow, richer so it reads as blue
magenta = "#B75E8B" # Magenta tinted toward dusty cream-tan
cyan = "#72C0B3"    # Cyan tinted toward stem green-white
white = "#FAF5E4"   # Sweet cream flesh

[bright]
black = "#706C4D"   # Medium earth, lifted for readable dim text
red = "#D37F7C"     # Bright red tinted toward light warm tan
green = "#7FB55B"   # Bright celery leaf, richer so it reads as green
yellow = "#E1D58E"  # Bright yellow core, softened
blue = "#81ABC7"    # Light blue, richer so it reads as blue
magenta = "#C987A8" # Bright magenta tinted toward light dusty cream
cyan = "#9AD5CB"    # Bright cyan tinted toward ferny bright green
white = "#FEFAF0"   # Brightest cream

[ui]
background = "#181810"
foreground = "#FAF5E4"
cursor = "#E8D898"
cursor_text = "#181810"
selection = "#D8C8A440"
border = "#3A3828"
tab_active = "#E8D898"
tab_inactive = "#282818"
search_match = "#80B06066"
url = "#C8D8A0"
