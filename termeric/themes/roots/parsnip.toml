[meta]
name = "Parsnip"
author = "Termeric"
description = "Off-white cream skin with sweet flesh and celery green leaves"

[primary]
black = "#332F29"   # Parsnip earth, a step above the background
red = "#D16A62"     # Red tinted toward warm tan
green = "#71A94C"   # Celery leaf green
yellow = "#D1AD39"  # Faint yellow core
blue = "#6891C1"    # Cool shadow blue
magenta = "#BD74A2" # Dusty rose
cyan = "#50AB9B"    # Stem green-teal
white = "#D1C7AA"   # Sweet cream flesh

[bright]
black = "#847C70"   # Warm grey for dim hints
red = "#E39187"     # Light warm red
green = "#8FC76E"   # Bright celery leaf
yellow = "#E0CA71"  # Bright yellow core
blue = "#8FB0DA"    # Light shadow blue
magenta = "#D697BF" # Light dusty rose
cyan = "#77C7BC"    # Bright stem teal
white = "#FAF7EB"   # Brightest cream

[ui]
background = "#1A1815"   # Warm charcoal
foreground = "#F1E9CE"   # Sweet cream
cursor = "#E1CB80"       # Yellow core
cursor_text = "#1A1815"  # Text under the cursor
selection = "#695A284D"  # Cream tint
border = "#38352F"       # Chrome separators
tab_active = "#E1CB80"   # Yellow core
tab_inactive = "#25221E" # Tab strip
search_match = "#4B742F" # Celery green
url = "#8FC36D"          # Celery green
