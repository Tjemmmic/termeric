[meta]
name = "Malanga"
author = "Termeric"
description = "Grey-brown skin with purple splotches — tropical root vibes"

[primary]
black = "#2F2828"   # Deep root bark, lifted off the background
red = "#CB6363"     # Red tinted toward purple-red skin blush
green = "#429442"   # Dark earthy leaf green, richer so it reads as green
yellow = "#CEA530"  # Rich yellow flower, softened
blue = "#6F80BF"    # Cool grey-violet, richer so it reads as blue
magenta = "#A06FBE" # Dark purple splotch, lifted for contrast
cyan = "#419083"    # Cyan tinted toward deep forest green
white = "#F0E8DC"   # Creamy white flesh

[bright]
black = "#746A6A"   # Medium grey-brown, lifted for readable dim text
red = "#D58080"     # Bright red tinted toward light purple-rose
green = "#4CAA4C"   # Bright earthy green, richer so it reads as green
yellow = "#D0B750"  # Bright gold flower, softened
blue = "#8996CA"    # Light violet-grey, richer so it reads as blue
magenta = "#B786C9" # Medium purple, richer so it reads as magenta
cyan = "#4AA696"    # Bright cyan tinted toward mid forest
white = "#FAF4E8"   # Bright cream

[ui]
background = "#1C1818"     # Terminal background
foreground = "#F0E8DC"     # Primary text
cursor = "#D4A82A"         # Block cursor
cursor_text = "#1C1818"    # Text under the cursor
selection = "#4A2D5C40"    # Selection tint over the background
border = "#3D3838"         # Chrome separators
tab_active = "#D4A82A"     # Active-tab accent line
tab_inactive = "#2C2828"   # Tab strip
search_match = "#4A6A4A66" # Search matches (drawn at 35% / 65% alpha)
url = "#A47684"            # Hyperlinks
