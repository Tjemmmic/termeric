[meta]
name = "Malanga"
author = "Termeric"
description = "Grey-brown skin with purple splotches — tropical root vibes"

[primary]
black = "#2F2828"   # Deep root bark, lifted off the background
red = "#C85959"     # Red tinted toward purple-red skin blush
green = "#3F8C3F"   # Dark earthy leaf green, richer so it reads as green
yellow = "#CEA530"  # Rich yellow flower, softened
blue = "#697ABC"    # Cool grey-violet, richer so it reads as blue
magenta = "#9B67BB" # Dark purple splotch, lifted for contrast
cyan = "#3E897D"    # Cyan tinted toward deep forest green
white = "#F0E8DC"   # Creamy white flesh

[bright]
black = "#746A6A"   # Medium grey-brown, lifted for readable dim text
red = "#D58080"     # Bright red tinted toward light purple-rose
green = "#4CAA4C"   # Bright earthy green, richer so it reads as green
yellow = "#D0B750"  # Bright gold flower, softened
blue = "#8996CA"    # Light violet-grey, richer so it reads as blue
magenta = "#B786C9" # Medium purple, richer so it reads as magenta
cyan = "#4AA696"    # Bright cyan tinted toward mid forest
white = "#FAF4E8"   # Bright cream

[ui]
background = "#1C1818"
foreground = "#F0E8DC"
cursor = "#D4A82A"
cursor_text = "#1C1818"
selection = "#4A2D5C40"
border = "#3D3838"
tab_active = "#D4A82A"
tab_inactive = "#2C2828"
search_match = "#4A6A4A66"
url = "#9B6878"
