[meta]
name = "Turmeric"
author = "Termeric"
description = "Colors inspired by the turmeric root — skin, flesh, and leaves"

[primary]
black = "#1C1410"   # Deep brown-black (dried skin)
red = "#C75646"     # Earthy red
green = "#5D8C4A"   # Turmeric leaf green
yellow = "#C9A227"  # Earthy yellow (inner layer)
blue = "#6B8E9B"    # Muted teal
magenta = "#A67B8A" # Dusty rose
cyan = "#4A8C7B"    # Leaf green-cyan
white = "#D4C4A8"   # Cream/tan (turmeric skin)

[bright]
black = "#3D3028"   # Lighter brown
red = "#E07B5F"     # Warm coral
green = "#7CB86A"   # Bright leaf green
yellow = "#E8A838"  # Bright orange-yellow (turmeric core)
blue = "#8BB0C0"    # Lighter teal
magenta = "#C899A8" # Light dusty rose
cyan = "#6BB89E"    # Bright leaf green
white = "#F5EBD9"   # Light cream

[ui]
background = "#1C1410"  # Dark brown (dried turmeric)
foreground = "#D4C4A8"  # Cream/tan (skin color)
cursor = "#E07B20"      # Bright orange (turmeric core)
cursor_text = "#1C1410" # Dark brown
selection = "#C9A22759"  # Earthy yellow selection
border = "#3D3028"      # Medium brown
tab_active = "#E07B20"  # Bright orange (core)
tab_inactive = "#2D2420" # Darker brown
search_match = "#7CB86A66" # Leaf green
url = "#6BB89E"         # Bright leaf green
