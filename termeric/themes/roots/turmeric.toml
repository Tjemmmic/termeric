[meta]
name = "Turmeric"
author = "Termeric"
description = "Colors inspired by the turmeric root — skin, flesh, and leaves"

[primary]
black = "#302520"   # Deep brown-black (dried skin), lifted off the background
red = "#C85848"     # Earthy red, lifted for contrast
green = "#5A9442"   # Turmeric leaf green, richer so it reads as green
yellow = "#C29F2E"  # Earthy yellow (inner layer), softened
blue = "#5483B2"    # Blue tinted toward muted teal
magenta = "#BA6789" # Dusty rose, richer so it reads as magenta
cyan = "#42947F"    # Leaf green-cyan, richer so it reads as cyan
white = "#D4C4A8"   # Cream/tan (turmeric skin)

[bright]
black = "#7E6454"   # Lighter brown, lifted for readable dim text
red = "#DB7A76"     # Bright red tinted toward warm coral
green = "#7ABB67"   # Bright leaf green, lifted for contrast
yellow = "#D0A250"  # Bright orange-yellow (turmeric core), softened
blue = "#83A5C8"    # Bright blue tinted toward lighter teal
magenta = "#CE93B1" # Light dusty rose, nudged apart from neighbouring hues
cyan = "#68BBAD"    # Bright cyan tinted toward bright leaf green
white = "#F5EBD9"   # Light cream

[ui]
background = "#1C1410"  # Dark brown (dried turmeric)
foreground = "#D4C4A8"  # Cream/tan (skin color)
cursor = "#E07B20"      # Bright orange (turmeric core)
cursor_text = "#1C1410" # Dark brown
selection = "#C9A22759"  # Earthy yellow selection
border = "#3D3028"      # Medium brown
tab_active = "#E07B20"  # Bright orange (core)
tab_inactive = "#2D2420" # Darker brown
search_match = "#7CB86A66" # Leaf green
url = "#6BB89E"         # Bright leaf green
