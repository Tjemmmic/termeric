[meta]
name = "Turmeric"
author = "Termeric"
description = "Colors inspired by the turmeric root — skin, flesh, and leaves"

[primary]
black = "#352F2B"   # Milky brown, a step above the background
red = "#CB867E"     # Muted cinnamon red
green = "#8EB479"   # Muted leaf green
yellow = "#D8BB77"  # Golden milk
blue = "#89A0C2"    # Muted slate blue
magenta = "#BE8CA9" # Muted rose
cyan = "#7DB5AD"    # Muted sage-teal
white = "#CCC0A7"   # Steamed milk

[bright]
black = "#887C6F"   # Muted brown for dim hints
red = "#DDA79E"     # Light cinnamon
green = "#AECD9E"   # Light leaf
yellow = "#E7D49E"  # Light honey
blue = "#A9BBD8"    # Light slate blue
magenta = "#D5ABC4" # Light rose
cyan = "#A3CDC9"    # Light sage-teal
white = "#F0E8D1"   # Milk foam

[ui]
background = "#1E1B18"   # Milky dark brown
foreground = "#E9DBBB"   # Creamy gold-white
cursor = "#E0A750"       # Honey gold
cursor_text = "#1E1B18"  # Text under the cursor
selection = "#705A304D"  # Golden milk tint
border = "#3A362F"       # Chrome separators
tab_active = "#E0A750"   # Honey gold
tab_inactive = "#282520" # Tab strip
search_match = "#7D6324" # Honey gold
url = "#86C1B9"          # Sage-teal
