[meta]
name = "Ginger"
author = "Termeric"
description = "Pale sandy tones from ginger root — warm and understated"

[primary]
black = "#35312B"   # Papery skin, a step above the background
red = "#CA8883"     # Muted pink-red
green = "#99B377"   # Muted olive leaf
yellow = "#D2BE85"  # Straw
blue = "#88A2BF"    # Muted shadow blue
magenta = "#BC8EAD" # Muted shoot pink
cyan = "#82B6AD"    # Muted reed teal
white = "#CCC1A9"   # Fibrous cream

[bright]
black = "#877E6F"   # Sand for dim hints
red = "#DCA8A2"     # Light muted pink-red
green = "#B5CD9B"   # Light olive leaf
yellow = "#E3D6A8"  # Light straw
blue = "#A9BDD6"    # Light shadow blue
magenta = "#D5ADC7" # Light shoot pink
cyan = "#A5CEC9"    # Light reed teal
white = "#F0E9D7"   # Light fibrous cream

[ui]
background = "#1F1C19"   # Sandy dark (papery skin)
foreground = "#E6DDC6"   # Straw cream
cursor = "#D7BA75"       # Straw gold
cursor_text = "#1F1C19"  # Text under the cursor
selection = "#6B59344D"  # Straw tint
border = "#3B3731"       # Chrome separators
tab_active = "#D7BA75"   # Straw gold
tab_inactive = "#292622" # Tab strip
search_match = "#566F35" # Olive leaf
url = "#A3C07F"          # Olive leaf
