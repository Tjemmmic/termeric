[meta]
name = "Taro"
author = "Termeric"
description = "Dusty brown skin, pale lavender flesh, purple veins — elephant ear"

[primary]
black = "#2D252D"   # Deep taro soil, lifted off the background
red = "#C75656"     # Red tinted toward muted purple-rose
green = "#3D8945"   # Giant elephant ear leaf, richer so it reads as green
yellow = "#D8C25A"  # Creamy spadix flower, softened
blue = "#7770BF"    # Blue tinted toward purple vein blue
magenta = "#9C63B9" # Purple flesh vein, richer so it reads as magenta
cyan = "#3C8679"    # Cyan tinted toward velvety leaf green
white = "#E8E0F0"   # Pale lavender flesh

[bright]
black = "#7D6557"   # Dark dusty brown skin, lifted for readable dim text
red = "#D37C7C"     # Bright red tinted toward light purple-rose
green = "#51A74B"   # Bright leaf green, richer so it reads as green
yellow = "#E1D88E"  # Light flower yellow, softened
blue = "#928DCC"    # Bright blue tinted toward light violet
magenta = "#B184C8" # Bright purple, lifted for contrast
cyan = "#50B0A0"    # Bright cyan tinted toward bright velvety green
white = "#F0E8F8"   # Bright lavender

[ui]
background = "#181418"
foreground = "#E8E0F0"
cursor = "#7B5C9B"
cursor_text = "#E8E0F0"
selection = "#7B5C9B30"
border = "#5C4A40"
tab_active = "#7B5C9B"
tab_inactive = "#281828"
search_match = "#E8D88C66"
url = "#9B80B8"
