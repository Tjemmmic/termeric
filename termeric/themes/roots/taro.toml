[meta]
name = "Taro"
author = "Termeric"
description = "Dusty brown skin, pale lavender flesh, purple veins — elephant ear"

[primary]
black = "#342D2A"   # Dusty brown skin, a step above the background
red = "#CF686B"     # Purple-rose red
green = "#5EAA59"   # Elephant-ear leaf
yellow = "#CDAD42"  # Creamy spadix
blue = "#7D8ACA"    # Periwinkle
magenta = "#B173C0" # Purple vein
cyan = "#53A99D"    # Velvety leaf teal
white = "#C7BED1"   # Pale lavender flesh

[bright]
black = "#887A70"   # Fibrous brown for dim hints
red = "#E38F8F"     # Light purple-rose
green = "#84C781"   # Light leaf
yellow = "#DFC86E"  # Light spadix
blue = "#A0A9DF"    # Light periwinkle
magenta = "#CB96D8" # Light purple vein
cyan = "#78C5BD"    # Light leaf teal
white = "#F2ECF7"   # Bright lavender

[ui]
background = "#1A1614"   # Dusty brown skin
foreground = "#E5DCEE"   # Lavender flesh
cursor = "#BA8FD7"       # Purple vein
cursor_text = "#1A1614"  # Text under the cursor
selection = "#673E8159"  # Lavender tint
border = "#363233"       # Chrome separators
tab_active = "#BA8FD7"   # Purple vein
tab_inactive = "#24201F" # Tab strip
search_match = "#7B661F" # Spadix cream
url = "#C59DD7"          # Lavender
