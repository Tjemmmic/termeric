yellow = "#E8D88C"  # Creamy spadix flower
blue = "#7B5C9B"    # Purple vein blue
magenta = "#8858A0" # Purple flesh vein
cyan = "#4A6848"    # Velvety leaf green
white = "#E8E0F0"   # Pale lavender flesh

[bright]
