[package]
name = "termeric"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "A GPU-accelerated terminal emulator with a warm, turmeric-inspired theme"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "termeric"
path = "src/main.rs"

[dependencies]
# Internal crates
termeric-core = { version = "0.1.0", path = "../termeric-core" }

# Windowing
winit = "0.30"
raw-window-handle = "0.6"
accesskit = "0.24.1"
accesskit_winit = "0.33.2"

# GPU rendering
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }

# Text rendering (0.19+ fixes variable-font matching through the `wght` axis)
cosmic-text = "0.19"
unicode-segmentation = "=1.13.3"
unicode_names2 = "=4.0.0"

# Image loading for window icon
image = "0.25"
flate2 = "1.1"
tempfile = "3"
base64 = "0.22"

# Clipboard (wayland-data-control needed for Wayland support)
arboard = { version = "3.4", features = ["wayland-data-control"] }

# Configuration
serde.workspace = true
serde_json = "1"
toml.workspace = true
directories = "6.0"

# Fuzzy matching for command palette
sublime_fuzzy = "0.7"

# Git integration
git2 = "0.19"

# Regular expressions for search
regex = "1"
sha2 = "0.10"

# Logging
log.workspace = true
env_logger.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific dependencies if needed

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-specific dependencies if needed

[target.'cfg(target_os = "linux")'.dependencies]
# XDG Desktop Portal accessibility preference monitoring.
zbus = "5.19"
freedesktop-icons = "0.4"
# Bounded cancellation for the asynchronous notification-signal listener.
async-channel = "2"
futures-lite = "2"

[dev-dependencies]
# Testing dependencies
tempfile = "3"

[package.metadata.deb]
maintainer = "Termeric Contributors <Tjemmmic@users.noreply.github.com>"
copyright = "2026, Termeric Contributors"
license-file = ["../LICENSE", "4"]
extended-description = """\
Termeric is a modern, GPU-accelerated terminal emulator built with Rust.
It features a warm, turmeric-inspired color theme and smooth rendering."""
depends = "$auto"
recommends = "mesa-vulkan-drivers"
section = "utils"
priority = "optional"
assets = [
    ["target/release/termeric", "usr/bin/", "755"],
    ["../assets/termeric.desktop", "usr/share/applications/", "644"],
    ["../assets/icons/termeric.png", "usr/share/icons/hicolor/1024x1024/apps/", "644"],
    ["../assets/terminfo/x/xterm-termeric", "usr/share/terminfo/x/", "644"],
    ["THIRD_PARTY_NOTICES.md", "usr/share/doc/termeric/", "644"],
]
