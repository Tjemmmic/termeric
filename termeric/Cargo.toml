[package]
name = "termeric"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "GPU-accelerated terminal emulator themed around roots and rhizomes"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "termeric"
path = "src/main.rs"

[dependencies]
# Internal crates
termeric-core = { version = "0.1.0", path = "../termeric-core" }

# Windowing
winit = "0.30"
raw-window-handle = "0.6"
accesskit = "0.24.1"
accesskit_winit = "0.33.2"

# GPU rendering
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }

# Text rendering (0.19+ fixes variable-font matching through the `wght` axis)
cosmic-text = "0.19"
# Locale for the desktop font system; the version cosmic-text already uses.
sys-locale = "0.3"
unicode-segmentation = "=1.13.3"
unicode_names2 = "=4.0.0"

# Image decoding for the window icon (PNG), notification icons (PNG, JPEG, GIF),
# and background images (PNG, JPEG); every other format is refused, so only
# these decoders are built.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# Decompressing Kitty file-transfer data
flate2 = "1.1"
# Private staging files for atomic writes of Termeric's own files (safe_fs)
tempfile = "3"
# OSC 52 clipboard-read replies
base64 = "0.22"

# Clipboard (wayland-data-control needed for Wayland support)
arboard = { version = "3.4", features = ["wayland-data-control"] }

# Configuration
serde.workspace = true
serde_json = { version = "1", features = ["raw_value"] }
toml.workspace = true
# Saving config.toml in place, keeping its comments and layout
toml_edit = "0.22"
directories = "6.0"

# Fuzzy matching for command palette
sublime_fuzzy = "0.7"

# Git integration. Termeric only reads and edits local repositories, so git2's
# HTTPS/SSH transports (and their OpenSSL/libssh2 dependency) stay off, even if
# a later release enables them by default again.
# libgit2 is always built from the bundled source, so the binary never depends
# on whichever system libgit2 the build machine happens to have.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

# Regular expressions for search
regex = "1"

# Content hashes for sessions, transcripts, and the live-domain protocol
sha2 = "0.10"

# Logging
log.workspace = true
env_logger.workspace = true

# Parsing the control, domain, and plugin subcommands
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }

# Error handling
anyhow.workspace = true

libc = "0.2"
# XDG Desktop Portal accessibility preference monitoring.
zbus = "5.19"
freedesktop-icons = "0.4"
# Bounded cancellation for the asynchronous notification-signal listener.
async-channel = "2"
futures-lite = "2"

[dev-dependencies]
# Generating the committed manual page and shell completions (cli/spec.rs)
clap_complete = "4.6"
clap_mangen = "0.2"
roff = "1"

[package.metadata.deb]
maintainer = "Termeric Contributors <Tjemmmic@users.noreply.github.com>"
copyright = "2026, Termeric Contributors"
license-file = ["../LICENSE", "4"]
extended-description = """\
Termeric is a GPU-accelerated terminal emulator for Linux, written in Rust
and themed around roots and rhizomes."""
# $auto sees only the linked libraries (libc, libgcc_s, zlib). winit, wgpu, and
# xkbcommon load the windowing, keyboard, and graphics libraries at runtime,
# and fontconfig-config brings the configuration and a font that fontdb reads.
depends = "$auto, fontconfig-config, libegl1, libvulkan1, libwayland-client0, libwayland-cursor0, libwayland-egl1, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libxkbcommon0, libxkbcommon-x11-0"
recommends = "mesa-vulkan-drivers"
section = "utils"
priority = "optional"
# The install tree from scripts/stage_install_tree.py, staged before
# `cargo deb --no-build` (see PACKAGING.md), so the .deb ships what every other
# package ships. Paths are relative to termeric/, so the tree is staged in the
# workspace's target/install-tree whatever CARGO_TARGET_DIR says.
assets = [
    ["../target/install-tree/bin/termeric", "usr/bin/", "755"],
    ["../target/install-tree/share/**/*", "usr/share/", "644"],
]
