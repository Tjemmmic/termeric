[package]
name = "termeric"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A GPU-accelerated terminal emulator with a warm, turmeric-inspired theme"

[[bin]]
name = "termeric"
path = "src/main.rs"

[dependencies]
# Internal crates
termeric-core = { path = "../termeric-core" }

# Windowing
winit = "0.30"
raw-window-handle = "0.6"

# GPU rendering
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }

# Text rendering (0.18+ for FontFeatures support)
cosmic-text = "0.18"

# Image loading for window icon
image = "0.25"

# Clipboard (wayland-data-control needed for Wayland support)
arboard = { version = "3.4", features = ["wayland-data-control"] }

# Configuration
serde.workspace = true
toml.workspace = true
directories = "6.0"

# Fuzzy matching for command palette
sublime_fuzzy = "0.7"

# Regular expressions for search
regex = "1"

# Logging
log.workspace = true
env_logger.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific dependencies if needed

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-specific dependencies if needed

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific dependencies if needed

[dev-dependencies]
# Testing dependencies
tempfile = "3"

[package.metadata.deb]
maintainer = "Termeric Contributors"
copyright = "2025, Termeric Contributors <termeric@example.com>"
license-file = ["../LICENSE", "4"]
extended-description = """\
Termeric is a modern, GPU-accelerated terminal emulator built with Rust.
It features a warm, turmeric-inspired color theme and smooth rendering."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/termeric", "usr/bin/", "755"],
    ["../assets/termeric.desktop", "usr/share/applications/", "644"],
    ["../assets/icons/termeric.png", "usr/share/icons/hicolor/1024x1024/apps/", "644"],
]
