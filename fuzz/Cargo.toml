[package]
name = "termeric-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# The domain_protocol target compiles termeric/src/domain/{model,protocol}.rs
# through #[path], and those files use these crates. Unused-dependency tools
# scan only this crate's own sources, so they would report them as unused.
[package.metadata.cargo-machete]
ignored = ["anyhow", "serde", "serde_json"]

[dependencies]
libfuzzer-sys = "0.4"
termeric-core = { path = "../termeric-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "terminal_bytes"
path = "fuzz_targets/terminal_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "domain_protocol"
path = "fuzz_targets/domain_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graphics_protocols"
path = "fuzz_targets/graphics_protocols.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
