# Termeric configuration example.
# Copy to ~/.config/termeric/config.toml. Every key is optional; a key you leave
# out keeps its default. The Configuration page of the user guide lists them all.

[shell]
# Shell to run in new tabs (leave unset for your login shell).
# program = "/bin/zsh"
# args = ["-l"]
# env = { EDITOR = "nvim" }

# A reusable launch: appears in the command palette and works with
# `termeric --terminal-profile development`. The program runs directly, and
# cwd must be an absolute path.
# [profiles.development]
# description = "Rust workspace"
# program = "/bin/zsh"
# args = ["-l"]
# cwd = "/home/user/src/project"
# title = "Project shell"
# env = { RUST_BACKTRACE = "1" }

# A serial console profile.
# [profiles.board]
# description = "Embedded development board"
# [profiles.board.serial]
# device = "/dev/serial/by-id/usb-example"
# baud = 115200
# data_bits = 8
# parity = "none"         # none, even, odd
# stop_bits = 1           # 1 or 2
# flow_control = "none"   # none, software, hardware

[font]
family = "monospace"
size = 12.0               # points
weight = 400              # 1 to 1000
bold_weight = 700         # at least `weight`
line_height = 1.2         # 0.8 to 3.0
ligatures = true
bold_is_bright = false    # bold also brightens ANSI colors 0 to 7
# Families tried, in order, for characters the main font lacks.
# fallback = ["Noto Sans Mono", "DejaVu Sans Mono"]

# OpenType features; these override the ligatures setting.
# [font.features]
# ss01 = 1
# calt = 0

# Prefer a font for a range of code points, such as Nerd Font icons.
# [[font.range_overrides]]
# start = 0xE000
# end = 0xF8FF
# family = "Symbols Nerd Font Mono"

[scrollback]
lines = 10000
max_memory_mib = 128      # per terminal
scroll_speed = 6.0        # lines per wheel step

[panes]
cwd = "focused"           # new splits start in: focused, tab, or process

[keyboard]
xterm_type = "normal"     # normal, legacy, vt220

[copy_mode]
bindings = "vi"           # vi or emacs

# Extra quick-select patterns (replace the built-in URL, path, and hash list).
# [[copy_mode.patterns]]
# name = "ticket"
# regex = "PROJ-[0-9]+"

[selection]
copy_on_select = false    # also copy a finished mouse selection to the clipboard

[theme]
# A built-in theme (turmeric, ginger, daikon, dracula, nord, ... 26 in all) or
# the name of a file in ~/.config/termeric/themes/ without ".toml".
name = "turmeric"
# path = "/path/to/custom-theme.toml"

[renderer]
backend = "auto"          # auto, gpu, software

[accessibility]
reduce_motion = "system"  # system, on, off
high_contrast = "system"  # system, on, off

[window]
width = 800
height = 600
opacity = 1.0             # 0.1 to 1.0
padding = 8
decorations = true
level = "normal"          # normal, always_on_top, always_on_bottom
tab_bar_position = "top"  # top or left
share_process = true      # new windows join a running Termeric

# A PNG or JPEG behind the terminal; a relative path is resolved beside this file.
[window.background_image]
# path = "/path/to/background.png"
opacity = 0.20
fit = "cover"             # cover, contain, stretch, center

[cursor]
style = "block"           # block, underline, beam
blink = true
blink_rate = 530          # milliseconds

[bell]
visual = true
audio = false
visual_duration_ms = 100

[splash]
mode = "firstboot"        # never, firstboot, newwindow, newtab

[security]
# Let programs read your screen one cell at a time (DECRQCRA). Keep off.
allow_screen_checksum_reports = false
# Let programs load Kitty images from files on disk. Keep off unless you trust
# every program you run.
allow_kitty_file_transfers = false
# Let `termeric control` send text to panes. Reading does not need this.
allow_gui_control_input = false

# Clipboard access from programs (OSC 52).
[security.osc52]
allow_read = false
allow_write = true
max_bytes = 1048576

[session]
enabled = true
auto_restore = false      # restore your last workspace at startup
auto_save = true          # save your workspace when Termeric exits
save_scrollback = true

# Saved commands for the Commands panel and the command palette.
# [[commands]]
# name = "SSH Production"
# command = "ssh admin@prod.example.com"
# alias = "prod"

# Change a built-in shortcut (the Settings shortcut editor writes these for you).
# [[shortcuts]]
# action = "new_tab"
# key = "t"
# ctrl = true

# A friendly name for a remote host used by experimental live domains.
# [domains.ssh_hosts.build]
# destination = "developer@build.example"
# description = "Build farm"

# Coding agents (experimental). Built-in IDs: claude-code, codex, gemini, opencode.
# [agents.gemini]
# enabled = false
# [agents.my-agent]
# name = "My Agent"
# program = "my-agent"

# [agent_status]
# notify = true

# [agent_view]
# open_agents_in = "terminal"   # terminal, split, full

# [supervisor]
# agent = "claude-code"
# mode = "assist"               # watch, assist, auto

# Harvest (experimental): a visual history of your commands.
[harvest]
enabled = false
show_indicators = true
max_history = 100
