# Turmeric Theme for Termeric
# A warm, earthy color scheme inspired by turmeric spice

[metadata]
name = "Turmeric"
author = "Termeric Team"
version = "1.0"
description = "The default Termeric theme inspired by turmeric spice"

[colors]
# The warm cream foreground evokes turmeric-stained cloth
foreground = "#E8DCC4"

# Deep brown-black background like dried turmeric root
background = "#1A1612"

# Bright turmeric gold for the cursor
cursor = "#E8A838"
cursor_text = "#1A1612"

# Muted selection that doesn't compete with content
selection_background = "#4A3828"
selection_foreground = "#E8DCC4"

# Search highlights in bright gold
search_match = "#E8A838"
search_match_focused = "#F5C04A"

# UI elements
border = "#4A3828"
scrollbar = "#4A3828"
scrollbar_hover = "#6B5840"

[colors.normal]
# Black: Deep charcoal matching background
black   = "#1A1612"

# Red: Terracotta, like clay pots used in spice markets
red     = "#C45B3E"

# Green: Olive green, like fresh turmeric leaves
green   = "#8B9A3B"

# Yellow: The star - turmeric gold
yellow  = "#E8A838"

# Blue: Muted slate, complementary to warm tones
blue    = "#5B7B8C"

# Magenta: Dusty rose, like dried flower garnishes
magenta = "#A65B5B"

# Cyan: Sage green, herbal and calming
cyan    = "#6B8B7B"

# White: Warm cream, like coconut milk in curry
white   = "#E8DCC4"

[colors.bright]
# Bright Black: Warm grey-brown
black   = "#4A3828"

# Bright Red: Vibrant terracotta
red     = "#E67350"

# Bright Green: Lime-olive, fresh and vibrant
green   = "#A8B84A"

# Bright Yellow: Intense turmeric gold
yellow  = "#F5C04A"

# Bright Blue: Lighter slate
blue    = "#7B9BAC"

# Bright Magenta: Blooming rose
magenta = "#C47B7B"

# Bright Cyan: Light sage
cyan    = "#8BAB9B"

# Bright White: Pure warm white
white   = "#FFF5E6"

[colors.dim]
foreground = "#A89A84"

[font]
family = "JetBrains Mono"
size = 14.0
fallback = ["Noto Color Emoji", "Symbols Nerd Font Mono"]

[window]
opacity = 1.0
padding = 10

[cursor]
style = "block"
blinking = true
blink_interval = 530
unfocused_style = "hollow"
