# Status describes the named layer, not the complete desktop product:
# - supported: implemented and linked to repeatable evidence
# - experimental: implemented behind an explicitly experimental contract
# - partial: a documented subset is implemented
# - parsed_only: state or syntax is recognized but the user path is disconnected
# - unsupported: no implementation is claimed

