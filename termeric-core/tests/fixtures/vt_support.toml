evidence = ["fixture:xtwinops-title-operations", "test:src/ansi/handler.rs#osc_zero_and_one_retain_separate_bounded_application_labels", "test:src/ansi/processor.rs#xterm_title_queries_and_stack_are_global_bounded_and_byte_exact", "test:../termeric/src/terminal/events.rs#title_changes_are_forwarded_but_title_queries_stay_with_the_owner", "test:../termeric/src/app/tests.rs#osc_titles_and_dynamic_colors_apply_to_exact_inactive_tab_and_pane_origins"]
