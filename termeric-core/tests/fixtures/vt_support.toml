layer = "core"
status = "supported"
evidence = ["fixture:left-right-margins", "test:src/term/mod.rs#declrmm_negotiates_queries_resets_and_disambiguates_csi_s", "test:src/term/mod.rs#horizontal_margins_constrain_dec_cursor_motion_origin_and_tabs", "test:src/term/mod.rs#margin_wrap_and_scroll_preserve_cells_outside_the_rectangle", "test:src/term/mod.rs#margin_character_and_line_edits_are_bounded_and_use_bce", "test:src/term/mod.rs#margin_index_reverse_index_and_explicit_scroll_share_the_rectangle", "test:src/term/mod.rs#images_scroll_only_when_fully_inside_horizontal_margins", "test:src/ansi/processor.rs#decrqss_reports_rendition_margins_and_cursor_style_and_recovers_from_cancel", "test:src/ansi/processor.rs#decrqm_reports_only_authoritative_standard_and_private_mode_state"]
notes = "Mode 69 disambiguates CSI s from cursor save and resets horizontal margins on either transition. Valid margins are at least two columns, home the cursor, combine with DECSTBM/DECOM, bound wrapping, cursor/tab controls and editing/scrolling, preserve independent cells outside the rectangle, atomically clear a wide grapheme that straddles an edit boundary, avoid false whole-row reflow links, and move only fully enclosed inline-image placements. Erase controls remain page-wide as specified."

[[sequence]]
id = "csi-rectangular-area-operations"
family = "CSI"
syntax = "DECCRA, DECFRA, DECERA, DECSERA"
layer = "core"
status = "supported"
evidence = ["fixture:rectangular-area-operations", "test:src/term/mod.rs#rectangular_fill_and_erase_apply_attributes_clipping_and_origin", "test:src/term/mod.rs#rectangular_selective_erase_retains_cell_attributes_and_wide_integrity", "test:src/term/mod.rs#rectangular_copy_is_overlap_safe_clipped_and_copies_complete_state", "test:src/term/mod.rs#rectangular_text_operations_share_image_placement_geometry", "test:src/graphics/mod.rs#rectangular_text_operations_crop_erase_and_copy_image_coverage"]
notes = "The VT400 copy/fill/erase family accepts defaulted and clipped coordinates, obeys DECOM without otherwise being constrained by margins, leaves the cursor unchanged, and rejects malformed/reversed requests. DECCRA is overlap-safe and maps every page parameter to the sole page available in each Termeric screen buffer. DECFRA accepts the DEC GL/GR printable ranges and applies current SGR/DECSCA state. DECERA applies BCE regardless of protection; DECSERA retains visual/protection attributes and protected graphemes. All operations repair boundary-straddling wide graphemes atomically. Copy/fill/erase also copy, crop, or clear normalized static-image placement coverage at cell boundaries. Attribute changes and checksum reports are covered by adjacent claims."

[[sequence]]
id = "csi-rectangular-checksum"
family = "CSI/DCS"
syntax = "DECRQCRA, DECCKSR"
layer = "app"
status = "supported"
evidence = ["fixture:rectangular-checksum-report", "test:src/term/mod.rs#rectangular_checksum_is_policy_gated_bounded_and_vt420_compatible", "test:src/term/mod.rs#rectangular_checksum_reports_legacy_attributes_origin_and_dec_graphics", "test:../termeric/src/config/mod.rs#terminal_data_security_defaults_are_conservative_and_bounded", "test:../termeric/src/tabs/mod.rs#screen_checksum_policy_updates_existing_and_future_tabs", "test:../termeric/src/panes/mod.rs#screen_checksum_policy_updates_existing_and_future_panes", "test:../termeric/src/domain/server.rs#domain_panes_inherit_the_server_checksum_policy"]
notes = "The opt-in VT420 checksum request accepts defaulted and clipped DECOM-relative rectangles, normalizes every page parameter to the single active page, preserves cursor state, and returns an uppercase 16-bit DEC/xterm checksum in a DECCKSR DCS response. The base VT420 algorithm covers drawn-cell blank rules, original DEC Special Graphics and UK G-set bytes, and protected/invisible/underline/inverse/blink/bold attribute weights without adding VT525 color extensions. Invalid or reversed rectangles report zero; malformed sequences are ignored. Reports are disabled by default because repeated one-cell requests can scrape visible terminal contents. XTCHECKSUM extensions are not claimed."

[[sequence]]
id = "csi-attribute-change-areas"
family = "CSI"
syntax = "DECSACE, DECCARA, DECRARA, DECRQSS *x"
layer = "core"
status = "supported"
evidence = ["fixture:attribute-change-areas", "test:src/term/mod.rs#attribute_change_extent_obeys_stream_rectangle_origin_and_reset_lifecycle", "test:src/term/mod.rs#attribute_change_and_reverse_apply_only_the_documented_rendition_subset", "test:src/ansi/processor.rs#decrqss_reports_rendition_margins_and_cursor_style_and_recovers_from_cancel"]
notes = "DECSACE selects the default drawn-cell-only wrapped stream or an exact rectangle that materializes untouched cells as spaces. Both forms apply DECOM to their endpoints; stream wrapping then spans the full page width. DECCARA supports ordered set/reset operations for bold, single underline, blink, inverse, and xterm hidden text while preserving unrelated modern attributes and all cell content, colors, protection, hyperlink, and width state. DECRARA reverses that subset with repeated parameters cancelling. Cursor and delayed-wrap state remain unchanged. DECRQSS reports 1*x or 2*x; DECSTR preserves the selection and RIS resets it to stream."

