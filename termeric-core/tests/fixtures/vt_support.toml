notes = "Accepts DEC operating levels 1-5, applies DECSTR-compatible soft-reset semantics without erasing screen or scrollback, selects and reports 7/8-bit reply framing, ignores Pc at level 1, rejects invalid higher-level Pc atomically, and resets to the level-4/7-bit startup profile on RIS. The stored level is negotiation/reporting state: Termeric does not hide implemented modern controls or change DA/terminfo identity when a lower level is selected, so strict historical feature gating is not claimed."

