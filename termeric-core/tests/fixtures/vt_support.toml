[[sequence]]
id = "c1-control-framing"
family = "C1/ESC"
syntax = "8-bit IND, NEL, HTS, RI, SS2, SS3, DCS, DECID, CSI, ST, OSC, APC; S7C1T/S8C1T; GR-byte folding in control bodies"
layer = "app"
status = "supported"
evidence = ["fixture:c1-control-framing", "fixture:c1-high-bit-control-bodies", "test:src/ansi/processor.rs#c1_input_is_utf8_safe_and_s7c1t_s8c1t_frame_every_core_reply", "test:../termeric/src/app/desktop_io.rs#app_mediated_osc_replies_use_the_origin_terminal_c1_mode"]
notes = "Supported raw C1 introducers and single controls are equivalent to their 7-bit forms. GR bytes in ESC/CSI bodies and supported DCS/OSC/APC protocol fields are normalized to their 7-bit equivalents, including a high-bit final in ESC ST; UTF-8 user text in title, hyperlink, and notification OSC families is deliberately preserved. Valid UTF-8 continuation bytes in ground text are never reinterpreted as C1 controls. Input accepts both representations independently of S7C1T/S8C1T; the terminal-local transmission preference frames core CSI/DCS/APC replies and origin-addressed OSC clipboard/color replies, survives DECSTR, and resets to 7-bit on RIS. Unsupported C1 functions remain outside this claim."

