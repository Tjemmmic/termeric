[[sequence]]
id = "csi-presentation-state"
family = "CSI/DCS"
syntax = "DECRQPSR, DECCIR, DECTABSR, DECRSPS"
layer = "core"
status = "supported"
evidence = ["fixture:presentation-state-roundtrip", "test:src/term/mod.rs#presentation_state_reports_are_byte_exact_bounded_and_strict", "test:src/term/mod.rs#presentation_state_restore_round_trips_and_rejects_atomically", "test:src/term/mod.rs#g2_g3_single_and_locking_shifts_are_one_shot_saved_and_resettable"]
notes = "DECRQPSR 1/2 returns byte-exact cursor-information or tab-stop DCS data using the selected 7-bit/8-bit reply framing. Cursor state covers the sole active page, bounded coordinates, DEC write rendition/protection, delayed wrap, DECOM, G0-G3 designations, GL/GR, and pending SS2/SS3. Tab state is a bounded 1-based column list. DECRSPS accepts either framing, validates the complete payload before applying it, preserves unrelated modern rendition flags, and leaves state unchanged on malformed data. Only the three supported 94-character sets are accepted; 96-character-set state, multiple pages, and extended reports are outside this claim."

