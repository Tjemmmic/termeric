# Fast checks for every pull request and every push to main. The slower
# suites (packages, native GUI, soak, benchmarks, fuzzing) live in
# extended.yml and run weekly or on demand.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev mesa-vulkan-drivers desktop-file-utils dpkg-dev \
            ncurses-bin vim less tmux zsh fish
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Test the helper scripts
        run: python3 -m unittest $(git ls-files 'scripts/test_*.py' | sed 's|/|.|; s|\.py$||')
      - name: Check Markdown links
        run: python3 scripts/check_markdown_links.py
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Build the user guide
        run: mdbook build docs
      - name: Check the terminfo entry with Vim, less, and tmux
        run: python3 scripts/check_terminfo.py --require-apps
