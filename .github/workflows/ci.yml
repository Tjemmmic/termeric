# Fast checks for every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    # A run without a warm cache compiles everything twice (Clippy, then tests) and takes about 25 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keep the compiled dependencies when a check fails, so the next push doesn't rebuild them.
          cache-on-failure: true
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev mesa-vulkan-drivers \
            ncurses-bin vim less tmux zsh fish
      - name: Close zsh's function directories to other users
        # The runner image leaves some writable by others, so the system
        # zshrc's compinit stops every interactive zsh to ask about them.
        run: zsh -fc 'autoload -Uz compaudit; compaudit || true' | xargs -r sudo chmod go-w
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # Fail, rather than skip, the Bash, Zsh, and Fish integration tests if a shell is missing.
          TERMERIC_REQUIRE_SHELL_ACCEPTANCE: "1"
      - name: Test the helper scripts
        run: python3 -m unittest $(git ls-files 'scripts/test_*.py' | sed 's|/|.|; s|\.py$||')
      - name: Check Markdown links
        run: python3 scripts/check_markdown_links.py
      - name: Validate the AppStream metadata and desktop entries
        run: |
          sudo apt-get install -y appstream desktop-file-utils
          appstreamcli validate --no-net assets/org.termeric.Termeric.metainfo.xml
          desktop-file-validate assets/*.desktop
      - name: Check the terminfo entry with Vim, less, and tmux
        run: python3 scripts/check_terminfo.py --require-apps

  macos:
    name: macOS (Apple silicon)
    runs-on: macos-15
    # A cold cache builds the tests, the debug app, and the release app (LTO)
    # on three cores; every step below has its own bound inside this one.
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The cache quota is shared with the Linux job; only main saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the shells and tools the tests drive
        timeout-minutes: 10
        # Bash 5 for the prompt tests (macOS's /bin/bash is 3.2), fish, tmux.
        run: brew install bash fish tmux
      - name: Clippy
        timeout-minutes: 20
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        timeout-minutes: 30
        env:
          TERMERIC_REQUIRE_SHELL_ACCEPTANCE: "1"
        run: cargo test --workspace --locked
      - name: GPU smokes on Metal
        timeout-minutes: 10
        env:
          WGPU_BACKEND: metal
          TERMERIC_GPU_SMOKE_HARDWARE: "1"
        run: cargo test -p termeric --locked -- --ignored gpu_render_smoke
      - name: Check the terminfo entry with macOS's own ncurses, vim, and less
        timeout-minutes: 5
        run: python3 scripts/check_terminfo.py --macos-system --require-apps
      - name: Test the helper scripts
        timeout-minutes: 5
        run: python3 -m unittest scripts.test_bundle_macos
      - name: Build the app with debug assertions, for the GUI smoke
        timeout-minutes: 15
        run: |
          cargo build -p termeric --locked
          python3 scripts/bundle_macos.py --binary target/debug/termeric --out target/smoke/Termeric.app --sign
      - name: GUI smoke
        timeout-minutes: 5
        run: python3 scripts/macos_gui_smoke.py --app target/smoke/Termeric.app --keep-log target/smoke/termeric.log
      - name: Keep the GUI smoke's log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-smoke-log
          path: target/smoke/termeric.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Build Termeric.app for testers
        timeout-minutes: 30
        run: |
          cargo build --release --locked
          python3 scripts/bundle_macos.py --binary target/release/termeric --out target/bundle/Termeric.app --sign
          ditto -c -k --keepParent target/bundle/Termeric.app target/bundle/Termeric-macos-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Termeric-macos-arm64
          path: target/bundle/Termeric-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Build for Intel and run it under Rosetta
        timeout-minutes: 20
        run: |
          cargo test --workspace --locked --target x86_64-apple-darwin --no-run
          cargo build -p termeric --locked --target x86_64-apple-darwin
          arch -x86_64 target/x86_64-apple-darwin/debug/termeric --version

