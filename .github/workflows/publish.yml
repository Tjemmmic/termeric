# Publishes a GitHub release to the apt repository and the AUR, when its draft is
# published. Run it by hand, with the tag, to publish again: after a failure, or
# after a fix to a recipe on the branch it runs from. Publishing what is already
# there changes nothing.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The newest published release's tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

# Containers otherwise run steps with plain sh.
defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    name: Check and download the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # An older release would take everyone's packages backwards.
      - name: Require the newest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag such as v0.1.0"
            exit 1
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '.[].tagName' | sort --version-sort --reverse > releases
          if [ "$(head -n 1 releases)" != "$TAG" ]; then
            echo "::error::$TAG is not the newest published release"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "previous=$(sed -n 2p releases)" >> "$GITHUB_OUTPUT"
      - name: Download the packages and check where they were built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          cd dist
          sha256sum --check --strict SHA256SUMS
          for package in *.deb; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG"
          done
      - name: Download the previous release's packages, to upgrade from
        if: steps.release.outputs.previous != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.previous != ''
        with:
          name: previous-packages
          path: previous/*.deb
          if-no-files-found: error

  apt-build:
    name: Build and sign the apt repository
    needs: release
    runs-on: ubuntu-24.04
    environment: apt
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Build the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          python3 scripts/build_apt_repository.py packages/*.deb --out repository \
            --url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/apt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-repository
          path: repository
          if-no-files-found: error

  apt-check:
    name: Install from the apt repository on ${{ matrix.image }} (${{ matrix.runner }})
    needs: [release, apt-build]
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Install, upgrade, and remove
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          apt-get update
          # As someone who downloaded the previous release's package has it.
          if [ -d artifacts/previous-packages ]; then
            apt-get install -y --no-install-recommends \
              ./artifacts/previous-packages/termeric_*_"$(dpkg --print-architecture)".deb
            termeric --version
          fi
          # apt reads repositories as its own unprivileged user.
          cp -r artifacts/apt-repository /srv/apt
          chmod -R a+rX /srv/apt
          sed 's|^URIs: .*|URIs: file:/srv/apt|' /srv/apt/termeric.sources \
            > /etc/apt/sources.list.d/termeric.sources
          apt-get update
          apt-get install -y --no-install-recommends termeric
          [ "$(termeric --version)" = "termeric $VERSION" ]
          apt-cache policy termeric | grep -F "file:/srv/apt stable/main"
          apt-get remove -y termeric
          [ ! -e /usr/bin/termeric ]

  apt-publish:
    name: Publish the apt repository
    needs: apt-check
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apt-repository
          path: site/apt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Apart from aur-publish, so nothing the build runs is near the AUR key.
  aur-build:
    name: Pin, build, and check the AUR recipe
    needs: release
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 90
    steps:
      # The image skips documentation, which the package check looks for.
      - name: Install packaging tools
        run: |
          sed -i '/^NoExtract/d' /etc/pacman.conf
          pacman -Syu --noconfirm --needed pacman-contrib python ncurses desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # makepkg refuses to run as root, and installs dependencies with sudo.
      - name: Pin the release's checksum
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          install -d -o builder /home/builder/termeric
          install -o builder packaging/arch/termeric/PKGBUILD /home/builder/termeric/PKGBUILD
          cd /home/builder/termeric
          if ! grep -qx "pkgver=$VERSION" PKGBUILD; then
            echo "::error::the recipe is not for $VERSION; run this from a branch or tag whose recipe is"
            exit 1
          fi
          runuser -u builder -- updpkgsums
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
          cat PKGBUILD
      - name: Build and test the package
        run: cd /home/builder/termeric && runuser -u builder -- makepkg --syncdeps --noconfirm
      - name: Check the package
        run: python3 scripts/check_arch_package.py --system-lifecycle /home/builder/termeric/termeric-[0-9]*.pkg.tar.zst
      - name: Collect the recipes
        run: |
          install -D -m 644 -t recipes/termeric /home/builder/termeric/{PKGBUILD,.SRCINFO}
          install -D -m 644 -t recipes/termeric-git packaging/arch/termeric-git/{PKGBUILD,.SRCINFO}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-recipes
          path: recipes
          include-hidden-files: true
          if-no-files-found: error

  aur-publish:
    name: Push the recipes to the AUR
    needs: [release, aur-build]
    runs-on: ubuntu-24.04
    environment: aur
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur-recipes
          path: recipes
      - name: Commit and push what changed
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as published at
          # https://archlinux.org/news/aur-migration-new-ssh-hostkeys/
          AUR_HOST_KEY: aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          (umask 077 && printf '%s\n' "$AUR_SSH_KEY" > "$RUNNER_TEMP/ssh/key")
          printf '%s\n' "$AUR_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o StrictHostKeyChecking=yes"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for package in termeric termeric-git; do
            git clone "ssh://aur@aur.archlinux.org/$package.git" "aur/$package"
            cp "recipes/$package/PKGBUILD" "recipes/$package/.SRCINFO" "aur/$package/"
            git -C "aur/$package" add PKGBUILD .SRCINFO
            if git -C "aur/$package" diff --cached --quiet; then
              echo "$package is up to date"
            else
              git -C "aur/$package" commit --message "Update to $VERSION"
              git -C "aur/$package" push origin HEAD:master
            fi
          done
