api_version = 29
id = "process-tab-pruner"
name = "Process Tab Pruner"
version = "1.0.0"
description = "Demonstrates exact ordinary-tab closure across process-owned windows"
permissions = ["process-spawn", "process-query", "process-tab-close", "event-subscribe", "ui-actions"]

[[commands]]
id = "close-tab-in-sibling-window"
name = "Close Tab in Another Window"
description = "Close one available tab in a sibling window without closing its window"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{"type": "query-process", "query_id": "tab-close-targets"}]
    elif event["type"] == "process-query-result":
        origin = event["origin_window_id"]
        target = next(
            (
                (window, tabs[0])
                for window in event["windows"] if window["id"] != origin
                for tabs in [[tab for tab in window["tabs"] if not tab["closed"]]]
                if len(tabs) > 1
            ),
            None,
        )
        if target is None:
            actions = [{
                "type": "show-notice",
                "title": "Process tab pruner",
                "lines": ["No sibling window with more than one open tab was found."],
            }]
        else:
            window, tab = target
            actions = [{
                "type": "close-process-tab",
                "action_id": "close-sibling-tab",
                "window_id": window["id"],
                "tab_id": tab["id"],
            }]
    elif event["type"] == "process-action-result" and event["action"] == "close-process-tab":
        if event["ok"]:
            lines = [
                f"Closing tab {event['tab_id']}.",
                f"Remaining tabs: {event['remaining_tabs']}",
                f"Active tab: {event['active_tab_id']}",
            ]
        else:
            lines = ["Tab closure failed: " + event["error"]]
        actions = [{"type": "show-notice", "title": "Process tab pruner", "lines": lines}]
    else:
        actions = []
    print(json.dumps({
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
