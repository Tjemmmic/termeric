api_version = 17
id = "terminal-writer"
name = "Terminal Writer"
version = "1.0.0"
description = "Demonstrates permissioned, reviewable text input to one exact local terminal"
permissions = ["process-spawn", "workspace-query", "terminal-input", "event-subscribe", "ui-actions"]

[[commands]]
id = "draft-cargo-test"
name = "Draft Cargo Test"
description = "Place cargo test in the active terminal without executing it"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

def notice(message):
    return [{
        "type": "show-notice",
        "title": "Terminal Writer",
        "lines": [message[:400]],
    }]

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "query-workspace",
            "query_id": "find-active-terminal",
        }]
    elif event["type"] == "workspace-query-result":
        active = next(
            (tab for tab in event["window"]["tabs"] if tab["active"]),
            None,
        )
        focused = next(
            (pane for pane in active["panes"] if pane["focused"]),
            None,
        ) if active else None
        if active is None or focused is None or active["closed"]:
            actions = notice("No writable active terminal was available.")
        else:
            actions = [{
                "type": "send-text",
                "action_id": "draft-cargo-test",
                "tab_id": active["id"],
                "pane_id": focused["id"],
                "text": "cargo test",
                "paste": False,
                "enter": False,
            }]
    elif event["type"] == "workspace-action-result":
        if event["ok"]:
            actions = notice("Drafted cargo test without executing it.")
        else:
            actions = notice("Terminal input failed: " + event["error"])
    else:
        actions = notice("Unexpected terminal-writer event.")
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
