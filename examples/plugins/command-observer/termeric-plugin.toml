api_version = 4
id = "command-observer"
name = "Command Observer"
version = "1.0.0"
description = "Consume bounded semantic command-completion events without UI actions"
permissions = ["process-spawn", "event-subscribe", "terminal-text"]

[event_handler]
program = "sh"
args = ["-c", "cat >/dev/null; printf '%s' '{\"schema_version\":1,\"actions\":[]}'"]
events = ["command-completed"]
