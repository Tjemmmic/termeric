api_version = 28
id = "process-pane-pruner"
name = "Process Pane Pruner"
version = "1.0.0"
description = "Demonstrates exact ordinary-pane closure across process-owned windows"
permissions = ["process-spawn", "process-query", "process-pane-close", "event-subscribe", "ui-actions"]

[[commands]]
id = "close-pane-in-sibling-window"
name = "Close Pane in Another Window"
description = "Close one available pane in a sibling window without closing its tab"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{"type": "query-process", "query_id": "pane-close-targets"}]
    elif event["type"] == "process-query-result":
        origin = event["origin_window_id"]
        target = next(
            (
                (window, tab, panes[0])
                for window in event["windows"] if window["id"] != origin
                for tab in window["tabs"] if not tab["closed"]
                for panes in [[pane for pane in tab["panes"] if not pane["closed"]]]
                if len(panes) > 1
            ),
            None,
        )
        if target is None:
            actions = [{
                "type": "show-notice",
                "title": "Process pane pruner",
                "lines": ["No sibling tab with more than one open pane was found."],
            }]
        else:
            window, tab, pane = target
            actions = [{
                "type": "close-process-pane",
                "action_id": "close-sibling-pane",
                "window_id": window["id"],
                "tab_id": tab["id"],
                "pane_id": pane["id"],
            }]
    elif event["type"] == "process-action-result" and event["action"] == "close-process-pane":
        if event["ok"]:
            lines = [
                f"Closed pane {event['pane_id']}.",
                f"Remaining panes: {event['remaining_panes']}",
                f"Focused pane: {event['focused_pane_id']}",
            ]
        else:
            lines = ["Pane closure failed: " + event["error"]]
        actions = [{"type": "show-notice", "title": "Process pane pruner", "lines": lines}]
    else:
        actions = []
    print(json.dumps({
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
