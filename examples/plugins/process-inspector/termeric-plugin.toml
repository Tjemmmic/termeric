api_version = 20
id = "process-inspector"
name = "Process Inspector"
version = "1.0.0"
description = "Demonstrates bounded, permissioned process-wide workspace inventory"
permissions = ["process-spawn", "process-query", "event-subscribe", "ui-actions"]

[[commands]]
id = "inspect-process"
name = "Inspect Process Windows"
description = "List the Termeric windows owned by this process"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "query-process",
            "query_id": "all-windows",
        }]
    elif event["type"] == "process-query-result":
        windows = event["windows"]
        origin = event["origin_window_id"]
        lines = [
            f"Visible inventory: {len(windows)} window(s)",
            f"Origin window: {origin}",
            f"Inventory truncated: {event['truncated']}",
        ]
        actions = [{
            "type": "show-notice",
            "title": "Termeric process",
            "lines": lines,
        }]
    else:
        actions = []
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
