api_version = 5
id = "persistent-counter"
name = "Persistent Counter"
version = "1.0.0"
description = "Demonstrates state retained by one correlated event process"
permissions = ["process-spawn", "event-subscribe", "ui-actions"]

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

count = 0
for line in sys.stdin:
    request = json.loads(line)
    count += 1
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": [{
            "type": "show-message",
            "message": f"Persistent event #{count}",
        }],
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["app-ready", "tab-created", "tab-switched"]
