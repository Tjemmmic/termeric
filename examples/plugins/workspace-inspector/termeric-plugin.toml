api_version = 6
id = "workspace-inspector"
name = "Workspace Inspector"
version = "1.0.0"
description = "Demonstrates a bounded current-window workspace query"
permissions = ["process-spawn", "workspace-query", "event-subscribe", "ui-actions"]

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "workspace-query-result":
        window = event["window"]
        tabs = window["tabs"]
        active = next((tab for tab in tabs if tab["active"]), None)
        lines = [
            f"Visible inventory: {len(tabs)} of {event['tab_count']} tabs",
            f"Active: {active['title'] if active else 'outside truncated inventory'}",
            f"Inventory truncated: {window['truncated']}",
        ]
        actions = [{
            "type": "show-notice",
            "title": "Current workspace",
            "lines": lines,
        }]
    else:
        actions = [{
            "type": "query-workspace",
            "query_id": "current-window",
        }]
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["app-ready", "tab-switched"]
