api_version = 15
id = "tab-pruner"
name = "Tab Pruner"
version = "1.0.0"
description = "Demonstrates permissioned closure scheduling for one non-active local tab"
permissions = ["process-spawn", "workspace-query", "tab-close", "event-subscribe", "ui-actions"]

[[commands]]
id = "close-background-tab"
name = "Close Background Tab"
description = "Schedule closure of one non-active ordinary local tab"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

def notice(message):
    return [{
        "type": "show-notice",
        "title": "Tab Pruner",
        "lines": [message[:400]],
    }]

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "query-workspace",
            "query_id": "find-background-tab",
        }]
    elif event["type"] == "workspace-query-result":
        candidate = next(
            (
                tab for tab in event["window"]["tabs"]
                if not tab["active"]
                and not tab["closed"]
                and tab["kind"] != "live_domain"
            ),
            None,
        )
        if candidate is None:
            actions = notice("No non-active ordinary local tab is available to close.")
        else:
            actions = [{
                "type": "close-tab",
                "action_id": "close-background-tab",
                "tab_id": candidate["id"],
            }]
    elif event["type"] == "workspace-action-result":
        if event["ok"]:
            actions = notice(
                f"Scheduled tab {event['tab_id']} for closure; "
                f"{event['remaining_tabs']} tab(s) remain."
            )
        else:
            actions = notice("Tab closure failed: " + event["error"])
    else:
        actions = notice("Unexpected tab-pruner event.")
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
