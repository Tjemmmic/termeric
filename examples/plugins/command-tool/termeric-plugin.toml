api_version = 9
id = "command-tool"
name = "Command Tool"
version = "1.0.0"
description = "Demonstrates a namespaced command handled by a persistent plugin process"
permissions = ["process-spawn", "workspace-query", "event-subscribe", "ui-actions"]

[[commands]]
id = "inspect-workspace"
name = "Inspect Workspace"
description = "Show the bounded workspace context supplied with this command"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    context = request.get("context", {})
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": [{
            "type": "show-notice",
            "title": "Command Tool",
            "lines": [
                f"Invoked: {event['command_id']}",
                f"Tabs: {context.get('tab_count', 'unavailable')}",
                f"Active index: {context.get('active_tab_index', 'unavailable')}",
            ],
        }],
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
