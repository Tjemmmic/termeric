api_version = 10
id = "configurable-command"
name = "Configurable Command"
version = "1.0.0"
description = "Demonstrates bounded non-secret settings delivered to a handler command"
permissions = ["process-spawn", "event-subscribe", "ui-actions"]

[[commands]]
id = "show-greeting"
name = "Show Configured Greeting"
description = "Display the current typed plugin settings"

[[settings]]
type = "text"
id = "greeting"
name = "Greeting"
description = "A bounded single-line greeting"
default = "Hello from Termeric"

[[settings]]
type = "choice"
id = "audience"
name = "Audience"
default = "workspace"
choices = ["workspace", "terminal"]

[[settings]]
type = "boolean"
id = "include-command-id"
name = "Include command ID"
default = false

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    settings = request["settings"]
    message = f"{settings['greeting']} ({settings['audience']})"
    if settings["include-command-id"]:
        message += f" via {event['command_id']}"
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": [{"type": "show-message", "message": message}],
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
