# Task Runner
#
# Launch profiles, with no event handler. "Project Tests" runs the test
# command from this plugin's settings in the active terminal's directory,
# prints where it ran, and leaves your shell open when the command exits.
# "Clean Shell" opens your shell in your home directory instead of the active
# terminal's (working_directory = "inherit").
#
# The test profile reads its command from TERMERIC_PLUGIN_SETTINGS_JSON and the
# active directory from TERMERIC_PLUGIN_CONTEXT_JSON (workspace-query).
#
#   termeric plugin install examples/plugins/task-runner \
#     --allow process-spawn --allow workspace-query --enable
#   termeric plugin configure task-runner --set test-command "npm test"

api_version = 1
id = "task-runner"
name = "Task Runner"
version = "1.0.0"
description = "A profile that runs your project's tests, and a clean shell"
permissions = ["process-spawn", "workspace-query"]

[[settings]]
type = "text"
id = "test-command"
name = "Test command"
description = "Shell command the Project Tests profile runs"
default = "cargo test"

[[profiles]]
id = "tests"
name = "Project Tests"
description = "Run the configured test command in the active directory"
program = "python3"
args = ["-c", """
import json, os
settings = json.loads(os.environ["TERMERIC_PLUGIN_SETTINGS_JSON"])["values"]
context = json.loads(os.environ.get("TERMERIC_PLUGIN_CONTEXT_JSON", "{}"))
command = settings["test-command"]
directory = context.get("active_working_directory") or os.getcwd()
print(f"$ {command}    ({directory})", flush=True)
shell = os.environ.get("SHELL") or "/bin/sh"
os.execvp(shell, [shell, "-c", command + '; exec "$0"'])
"""]
working_directory = "active"

[[profiles]]
id = "shell"
name = "Clean Shell"
description = "Open your shell in your home directory, not the active one"
program = "sh"
args = ["-c", 'exec "${SHELL:-/bin/sh}"']
working_directory = "inherit"
