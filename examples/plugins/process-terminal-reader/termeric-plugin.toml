api_version = 22
id = "process-terminal-reader"
name = "Process Terminal Reader"
version = "1.0.0"
description = "Demonstrates bounded, permissioned terminal text queries across process-owned windows"
permissions = ["process-spawn", "process-query", "process-terminal-text", "event-subscribe", "ui-actions"]

[[commands]]
id = "read-sibling-pane"
name = "Read Sibling Pane Text"
description = "Read a bounded snapshot from the first available pane in another window"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "query-process",
            "query_id": "terminal-targets",
        }]
    elif event["type"] == "process-query-result":
        origin = event["origin_window_id"]
        targets = [
            (window, tab, pane)
            for window in event["windows"]
            if window["id"] != origin
            for tab in window["tabs"]
            if not tab["closed"]
            for pane in tab["panes"]
            if not pane["closed"]
        ]
        target = next(iter(targets), None)
        if target is None:
            actions = [{
                "type": "show-notice",
                "title": "Process terminal reader",
                "lines": ["No available sibling-window pane was found."],
            }]
        else:
            window, tab, pane = target
            actions = [{
                "type": "query-process-terminal",
                "query_id": "sibling-output",
                "window_id": window["id"],
                "tab_id": tab["id"],
                "pane_id": pane["id"],
                "history_lines": 20,
                "max_bytes": 2048,
            }]
    elif event["type"] == "process-terminal-query-result":
        if event["ok"]:
            preview = "".join(
                character if character.isprintable() else " "
                for character in event["text"]
            ).strip()[:200]
            actions = [{
                "type": "show-notice",
                "title": "Sibling pane text",
                "lines": [
                    f"Text bytes: {event['text_bytes']}",
                    f"History lines: {event['history_lines']}",
                    f"Truncated: {event['truncated']}",
                    f"Preview: {preview or '(empty)'}",
                ],
            }]
        else:
            actions = [{
                "type": "show-notice",
                "title": "Process terminal reader",
                "lines": ["The selected pane could not be read."],
            }]
    else:
        actions = []
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
