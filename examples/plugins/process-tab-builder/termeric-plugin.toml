api_version = 24
id = "process-tab-builder"
name = "Process Tab Builder"
version = "1.0.0"
description = "Demonstrates exact ordinary-tab creation across process-owned windows"
permissions = ["process-spawn", "process-query", "process-tab-create", "event-subscribe", "ui-actions"]

[[commands]]
id = "new-tab-in-sibling-window"
name = "New Tab in Another Window"
description = "Create one ordinary local shell tab in the first available sibling window"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "query-process",
            "query_id": "tab-creation-targets",
        }]
    elif event["type"] == "process-query-result":
        origin = event["origin_window_id"]
        target = next(
            (window for window in event["windows"] if window["id"] != origin),
            None,
        )
        if target is None:
            actions = [{
                "type": "show-notice",
                "title": "Process tab builder",
                "lines": ["No available sibling window was found."],
            }]
        else:
            actions = [{
                "type": "create-process-tab",
                "action_id": "new-sibling-task",
                "window_id": target["id"],
            }]
    elif event["type"] == "process-action-result" and event["action"] == "create-process-tab":
        if event["ok"]:
            lines = [
                f"Created tab {event['tab_id']}.",
                f"Window: {event['window_id']}",
            ]
        else:
            lines = ["Tab creation failed: " + event["error"]]
        actions = [{
            "type": "show-notice",
            "title": "Process tab builder",
            "lines": lines,
        }]
    else:
        actions = []
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
