# Pane Layouts
#
# "Dev Layout" grows the active tab one step at a time: a single pane gains a
# pane to its right, two panes gain a third below the focused one, and three
# or more are arranged as one tall main pane beside a stack.
#
# The command queries the workspace to find the active tab and focused pane,
# then performs one pane change; a failure appears as a message. This is the
# whole query-then-act conversation a handler can have.
#
#   termeric plugin install examples/plugins/pane-layouts \
#     --allow process-spawn --allow event-subscribe --allow ui-actions \
#     --allow workspace-query --allow pane-create --allow pane-layout --enable

api_version = 1
id = "pane-layouts"
name = "Pane Layouts"
version = "1.0.0"
description = "A command that grows the active tab into a main pane and a stack"
permissions = [
    "process-spawn",
    "event-subscribe",
    "ui-actions",
    "workspace-query",
    "pane-create",
    "pane-layout",
]

[[commands]]
id = "dev-layout"
name = "Dev Layout"
description = "Add a pane, or arrange three or more as a main pane and a stack"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json, sys

def short(text, limit=400):
    return text.encode()[:limit].decode(errors="ignore")

def active_tab(windows, origin):
    for window in windows:
        if window["id"] == origin:
            return next((t for t in window["tabs"] if t["active"] and not t["closed"]), None)
    return None

def grow(tab):
    panes = [pane for pane in tab["panes"] if not pane["closed"]]
    target = {"action_id": "dev-layout", "tab_id": tab["id"]}
    if len(panes) >= 3:
        return dict(target, type="apply-pane-layout", preset="tall")
    focused = next((pane for pane in panes if pane["focused"]), panes[0])
    direction = "vertical" if len(panes) == 1 else "horizontal"
    return dict(target, type="create-pane", pane_id=focused["id"], direction=direction)

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    actions = []
    if event["type"] == "command-invoked":
        actions.append({"type": "query-workspace", "query_id": "dev-layout"})
    elif event["type"] == "workspace-query-result":
        tab = active_tab(event["windows"], request["origin_window_id"])
        if tab is None or all(pane["closed"] for pane in tab["panes"]):
            actions.append({"type": "show-message", "message": "No active tab to arrange"})
        else:
            actions.append(grow(tab))
    elif event["type"] == "action-result" and not event["ok"]:
        actions.append({"type": "show-message", "message": "Layout unchanged: " + short(event["error"])})
    reply = {"schema_version": 1, "request_id": request["request_id"], "actions": actions}
    print(json.dumps(reply), flush=True)
"""]
events = ["command-invoked"]
