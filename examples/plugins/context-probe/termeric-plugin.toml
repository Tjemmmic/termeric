api_version = 2
id = "context-probe"
name = "Context Probe"
version = "1.0.0"
description = "Print the bounded structured launch context granted by Termeric"
permissions = ["process-spawn", "workspace-query"]

[[profiles]]
id = "show"
name = "Show Structured Context"
description = "Open a tab and pretty-print TERMERIC_PLUGIN_CONTEXT_JSON"
program = "python3"
args = ["-c", "import json, os; print(json.dumps(json.loads(os.environ['TERMERIC_PLUGIN_CONTEXT_JSON']), indent=2, sort_keys=True))"]
working_directory = "active"
