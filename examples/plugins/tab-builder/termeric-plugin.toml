api_version = 13
id = "tab-builder"
name = "Tab Builder"
version = "1.0.0"
description = "Demonstrates permissioned ordinary-tab creation in the current window"
permissions = ["process-spawn", "tab-create", "event-subscribe", "ui-actions"]

[[commands]]
id = "new-task-tab"
name = "New Task Tab"
description = "Create one ordinary local shell tab in this window"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

def notice(message):
    return [{
        "type": "show-notice",
        "title": "Tab Builder",
        "lines": [message[:400]],
    }]

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "create-tab",
            "action_id": "new-task-tab",
        }]
    elif event["type"] == "workspace-action-result":
        if event["ok"]:
            actions = notice(f"Created tab {event['created_tab_id']}.")
        else:
            actions = notice("Tab creation failed: " + event["error"])
    else:
        actions = notice("Unexpected tab-builder event.")
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
