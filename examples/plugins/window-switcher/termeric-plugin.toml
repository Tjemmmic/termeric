# Window Switcher
#
# "Jump to Tab" finds the first tab, in any Termeric window, whose title
# contains the "Tab title" setting (case-insensitive), and selects it in its
# window. Run it again once that tab is selected to bring its window forward.
# That second step works only on X11: on Wayland the compositor decides focus,
# so Termeric refuses it and the plugin shows why.
#
# The command queries every window (workspace-query:all-windows), then either
# selects a tab in any window (navigate:all-windows) or focuses a window
# (window-focus).
#
#   termeric plugin install examples/plugins/window-switcher \
#     --allow process-spawn --allow event-subscribe --allow ui-actions \
#     --allow workspace-query:all-windows --allow navigate:all-windows \
#     --allow window-focus --enable
#   termeric plugin configure window-switcher --set tab-title "server"

api_version = 1
id = "window-switcher"
name = "Window Switcher"
version = "1.0.0"
description = "Jump to a tab by title in any window"
permissions = [
    "process-spawn",
    "event-subscribe",
    "ui-actions",
    "workspace-query:all-windows",
    "navigate:all-windows",
    "window-focus",
]

[[settings]]
type = "text"
id = "tab-title"
name = "Tab title"
description = "Text that Jump to Tab looks for in tab titles"
default = "server"

[[commands]]
id = "jump-to-tab"
name = "Jump to Tab"
description = "Select the first tab whose title matches the setting, then focus its window (X11)"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json, sys

def short(text, limit=400):
    return text.encode()[:limit].decode(errors="ignore")

def jump_to_tab(windows, needle):
    for window in windows:
        for tab in window["tabs"]:
            if tab["closed"] or needle.lower() not in tab["title"].lower():
                continue
            if tab["active"]:
                return [{"type": "focus-window", "action_id": "jump", "window_id": window["id"]}]
            return [
                {"type": "select-tab", "action_id": "jump", "window_id": window["id"], "tab_id": tab["id"]},
                {"type": "show-message", "message": "Tab selected; run Jump to Tab again to bring its window forward (X11 only)"},
            ]
    return [{"type": "show-message", "message": "No tab title contains " + short(repr(needle), 200)}]

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    actions = []
    if event["type"] == "command-invoked":
        actions.append({"type": "query-workspace", "query_id": "jump-to-tab"})
    elif event["type"] == "workspace-query-result":
        actions = jump_to_tab(event["windows"], request["settings"]["tab-title"])
    elif event["type"] == "action-result" and not event["ok"]:
        actions.append({"type": "show-message", "message": "Window switch failed: " + short(event["error"])})
    reply = {"schema_version": 1, "request_id": request["request_id"], "actions": actions}
    print(json.dumps(reply), flush=True)
"""]
events = ["command-invoked"]
