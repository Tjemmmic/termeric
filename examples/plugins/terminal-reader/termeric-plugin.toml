api_version = 11
id = "terminal-reader"
name = "Terminal Reader"
version = "1.0.0"
description = "Demonstrates one permissioned query of an exact pane's presented terminal text"
permissions = ["process-spawn", "workspace-query", "terminal-query", "event-subscribe", "ui-actions"]

[[commands]]
id = "read-active-terminal"
name = "Read Active Terminal"
description = "Display a short snippet of text currently presented by the active pane"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

def notice(message):
    return [{
        "type": "show-notice",
        "title": "Active terminal",
        "lines": [message[:400]],
    }]

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "query-workspace",
            "query_id": "find-active-pane",
        }]
    elif event["type"] == "workspace-query-result":
        active = next(
            (tab for tab in event["window"]["tabs"] if tab["active"]),
            None,
        )
        focused = next(
            (pane for pane in active["panes"] if pane["focused"]),
            None,
        ) if active else None
        if active is None or focused is None:
            actions = notice("The active pane is outside the bounded workspace inventory.")
        else:
            actions = [{
                "type": "query-terminal",
                "query_id": "active-pane-text",
                "tab_id": active["id"],
                "pane_id": focused["id"],
                "history_lines": 20,
                "max_bytes": 2048,
            }]
    elif event["type"] == "terminal-query-result":
        if not event["ok"]:
            actions = notice("Terminal query failed: " + event["error"])
        else:
            snippet = event["text"][-400:].replace("\\r", " ").replace("\\n", " ⏎ ")
            snippet = " ".join(snippet.split())
            actions = notice(snippet or "The active pane has no presented text.")
    else:
        actions = notice("Unexpected terminal-reader event.")
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
