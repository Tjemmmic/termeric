api_version = 19
id = "window-closer"
name = "Window Closer"
version = "1.0.0"
description = "Demonstrates command-scoped, permissioned closure of the invoking window"
permissions = ["process-spawn", "workspace-query", "window-close", "event-subscribe"]

[[commands]]
id = "close-current-window"
name = "Close Current Window"
description = "Close the exact Termeric window in which this command was invoked"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "query-workspace",
            "query_id": "confirm-current-window",
        }]
    elif event["type"] == "workspace-query-result":
        actions = [{
            "type": "close-window",
            "action_id": "close-current-window",
        }]
    else:
        # The close result is the final callback. Termeric reads this response
        # before dropping the exact App/window and ignores any UI actions.
        actions = []
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
