api_version = 12
id = "pane-builder"
name = "Pane Builder"
version = "1.0.0"
description = "Demonstrates permissioned stable-ID creation of one ordinary pane"
permissions = ["process-spawn", "workspace-query", "pane-create", "event-subscribe", "ui-actions"]

[[commands]]
id = "split-active-pane"
name = "Split Active Pane"
description = "Split the active ordinary pane vertically using its stable IDs"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

def notice(message):
    return [{
        "type": "show-notice",
        "title": "Pane Builder",
        "lines": [message[:400]],
    }]

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "query-workspace",
            "query_id": "find-active-pane",
        }]
    elif event["type"] == "workspace-query-result":
        active = next(
            (tab for tab in event["window"]["tabs"] if tab["active"]),
            None,
        )
        focused = next(
            (pane for pane in active["panes"] if pane["focused"]),
            None,
        ) if active else None
        if active is None or focused is None:
            actions = notice("The active pane is outside the bounded workspace inventory.")
        else:
            actions = [{
                "type": "create-pane",
                "action_id": "split-active-pane",
                "tab_id": active["id"],
                "pane_id": focused["id"],
                "direction": "vertical",
            }]
    elif event["type"] == "workspace-action-result":
        if event["ok"]:
            actions = notice(f"Created pane {event['created_pane_id']}.")
        else:
            actions = notice("Pane creation failed: " + event["error"])
    else:
        actions = notice("Unexpected pane-builder event.")
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
