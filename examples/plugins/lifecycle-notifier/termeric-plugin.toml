api_version = 3
id = "lifecycle-notifier"
name = "Lifecycle Notifier"
version = "1.0.0"
description = "A minimal structured app-ready handler with no launch profile"
permissions = ["process-spawn", "event-subscribe", "ui-actions"]

[event_handler]
program = "sh"
args = [
  "-c",
  "cat >/dev/null; printf '%s' '{\"schema_version\":1,\"actions\":[{\"type\":\"show-message\",\"message\":\"Lifecycle notifier is ready\"}]}'",
]
events = ["app-ready"]
