api_version = 8
id = "workspace-organizer"
name = "Workspace Organizer"
version = "1.0.0"
description = "Demonstrates permissioned stable-ID tab ordering and divider ratios"
permissions = ["process-spawn", "workspace-query", "workspace-topology", "event-subscribe", "ui-actions"]

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "workspace-query-result":
        active = next(
            ((index, tab) for index, tab in enumerate(event["window"]["tabs"]) if tab["active"]),
            None,
        )
        if active is None:
            actions = [{
                "type": "show-notice",
                "title": "Workspace organizer",
                "lines": ["The active tab is outside the bounded inventory."],
            }]
        else:
            index, tab = active
            divider = next((item for item in tab["dividers"] if item["kind"] == "local"), None)
            if divider is not None:
                # Reapplying the current ratio is intentionally non-invasive.
                actions = [{
                    "type": "resize-divider",
                    "action_id": "keep-current-ratio",
                    "tab_id": tab["id"],
                    "divider_id": divider["id"],
                    "ratio_millis": divider["ratio_millis"],
                }]
            elif tab["kind"] != "live_domain":
                # Moving the active tab to its current index is also non-invasive.
                actions = [{
                    "type": "move-tab",
                    "action_id": "keep-current-order",
                    "tab_id": tab["id"],
                    "destination_index": index,
                }]
            else:
                actions = [{
                    "type": "show-notice",
                    "title": "Workspace organizer",
                    "lines": ["API v8 intentionally leaves live-domain topology unchanged."],
                }]
    elif event["type"] == "workspace-action-result":
        status = "succeeded" if event["ok"] else f"failed: {event['error']}"
        actions = [{
            "type": "show-notice",
            "title": "Workspace organizer",
            "lines": [f"Stable-ID {event['action']} {status}."],
        }]
    else:
        actions = [{
            "type": "query-workspace",
            "query_id": "current-window",
        }]
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["app-ready"]
