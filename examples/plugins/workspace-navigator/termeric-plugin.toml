api_version = 7
id = "workspace-navigator"
name = "Workspace Navigator"
version = "1.0.0"
description = "Demonstrates permissioned stable-ID workspace navigation"
permissions = ["process-spawn", "workspace-query", "workspace-actions", "event-subscribe", "ui-actions"]

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "workspace-query-result":
        active = next((tab for tab in event["window"]["tabs"] if tab["active"]), None)
        if active is None:
            actions = [{
                "type": "show-notice",
                "title": "Workspace navigator",
                "lines": ["The active tab is outside the bounded inventory."],
            }]
        else:
            # Selecting the already-active tab is intentionally non-invasive.
            actions = [{
                "type": "select-tab",
                "action_id": "select-current",
                "tab_id": active["id"],
            }]
    elif event["type"] == "workspace-action-result":
        status = "succeeded" if event["ok"] else f"failed: {event['error']}"
        actions = [{
            "type": "show-notice",
            "title": "Workspace navigator",
            "lines": [f"Stable-ID {event['action']} {status}."],
        }]
    else:
        actions = [{
            "type": "query-workspace",
            "query_id": "current-window",
        }]
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["app-ready"]
