api_version = 25
id = "process-pane-builder"
name = "Process Pane Builder"
version = "1.0.0"
description = "Demonstrates exact ordinary-pane creation across process-owned windows"
permissions = ["process-spawn", "process-query", "process-pane-create", "event-subscribe", "ui-actions"]

[[commands]]
id = "split-pane-in-sibling-window"
name = "Split Pane in Another Window"
description = "Split the first available pane in the first available sibling window"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "query-process",
            "query_id": "pane-creation-targets",
        }]
    elif event["type"] == "process-query-result":
        origin = event["origin_window_id"]
        target = next(
            (
                (window, tab, pane)
                for window in event["windows"] if window["id"] != origin
                for tab in window["tabs"] if not tab["closed"]
                for pane in tab["panes"] if not pane["closed"]
            ),
            None,
        )
        if target is None:
            actions = [{
                "type": "show-notice",
                "title": "Process pane builder",
                "lines": ["No available sibling pane was found."],
            }]
        else:
            window, tab, pane = target
            actions = [{
                "type": "create-process-pane",
                "action_id": "split-sibling-task",
                "window_id": window["id"],
                "tab_id": tab["id"],
                "pane_id": pane["id"],
                "direction": "vertical",
            }]
    elif event["type"] == "process-action-result" and event["action"] == "create-process-pane":
        if event["ok"]:
            lines = [
                f"Created pane {event['created_pane_id']}.",
                f"Window: {event['window_id']}",
                f"Tab: {event['tab_id']}",
            ]
        else:
            lines = ["Pane creation failed: " + event["error"]]
        actions = [{
            "type": "show-notice",
            "title": "Process pane builder",
            "lines": lines,
        }]
    else:
        actions = []
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
