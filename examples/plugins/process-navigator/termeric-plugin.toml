api_version = 21
id = "process-navigator"
name = "Process Navigator"
version = "1.0.0"
description = "Demonstrates exact non-activating navigation across process-owned windows"
permissions = ["process-spawn", "process-query", "process-actions", "event-subscribe", "ui-actions"]

[[commands]]
id = "focus-first-pane"
name = "Focus First Pane in Another Window"
description = "Select a sibling window's first available tab and pane without activating it"

[event_handler]
program = "python3"
args = ["-u", "-c", """
import json
import sys

for line in sys.stdin:
    request = json.loads(line)
    event = request["event"]
    if event["type"] == "command-invoked":
        actions = [{
            "type": "query-process",
            "query_id": "navigation-targets",
        }]
    elif event["type"] == "process-query-result":
        origin = event["origin_window_id"]
        targets = [
            (window, tab)
            for window in event["windows"]
            if window["id"] != origin
            for tab in window["tabs"]
            if not tab["closed"]
        ]
        target = next(iter(targets), None)
        if target is None:
            actions = [{
                "type": "show-notice",
                "title": "Process navigator",
                "lines": ["No available sibling-window tab was found."],
            }]
        else:
            window, tab = target
            panes = [pane for pane in tab["panes"] if not pane["closed"]]
            if panes:
                actions = [{
                    "type": "focus-process-pane",
                    "action_id": "focus-target",
                    "window_id": window["id"],
                    "tab_id": tab["id"],
                    "pane_id": panes[0]["id"],
                }]
            else:
                actions = [{
                    "type": "select-process-tab",
                    "action_id": "select-target",
                    "window_id": window["id"],
                    "tab_id": tab["id"],
                }]
    elif event["type"] == "process-action-result":
        state = "completed" if event["ok"] else "failed"
        actions = [{
            "type": "show-notice",
            "title": "Process navigator",
            "lines": [
                f"Navigation {state}.",
                f"Window: {event['window_id']}",
                f"Action: {event['action']}",
            ],
        }]
    else:
        actions = []
    response = {
        "schema_version": 2,
        "request_id": request["request_id"],
        "actions": actions,
    }
    print(json.dumps(response, separators=(",", ":")), flush=True)
"""]
mode = "persistent"
events = ["command-invoked"]
